name: CI test

on:
  push:
    branches-ignore:
      - autorelease
  pull_request:
    branches:
      - devel

jobs:
  test:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version: ["3", "3.14", "3.8"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run test
        run: |
          uv sync --locked
          uv run --frozen python -m publicsuffixlist.test
      - name: Run linters
        if: matrix.python-version == '3'
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy
