name: CI test

on:
  push:
    branches-ignore:
      - autorelease
  pull_request:
    branches:
      - devel

jobs:
  test:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version: ["3", "3.14", "3.8"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run test
        run: |
          uv sync --locked
          uv run --frozen python -m publicsuffixlist.test
