[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "publicsuffixlist"
dynamic = ["version"]
description = "publicsuffixlist implement"
readme = "README.md"
requires-python = ">=3.8"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "ko-zu", email = "causeless@gmail.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Text Processing :: Filters",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ko-zu/psl"
Repository = "https://github.com/ko-zu/psl"

[project.optional-dependencies]
update = ["requests"]
readme = ["pandoc"]

[project.scripts]
publicsuffixlist-download = "publicsuffixlist.update:updatePSL"

[dependency-groups]
dev = [
    "requests",
    "ruff",
    "mypy",
]

[tool.hatch.version]
path = "publicsuffixlist/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["publicsuffixlist"]

[tool.hatch.build.targets.sdist]
include = [
    "/publicsuffixlist",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py38"
line-length = 119
include = ["pyproject.toml", "publicsuffixlist/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
# The package supports Python 3.8, but current mypy only accepts 3.10 or later.
python_version = "3.10"
files = ["publicsuffixlist"]

# The optional `requests` dependency does not ship type stubs.
[[tool.mypy.overrides]]
module = ["requests", "requests.*"]
ignore_missing_imports = true
